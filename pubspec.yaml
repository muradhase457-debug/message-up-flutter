name: message_up
description: Message Up — native Flutter chat app (WhatsApp + Messenger + Facebook in one).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  # PINNED to 6.x ON PURPOSE: lib/services/auth_service.dart uses the
  # google_sign_in 6.x API (GoogleSignIn() / signIn() / authentication /
  # signOut()). The 7.x API is different (GoogleSignIn.instance /
  # authenticate()) — do NOT bump to 7.x without migrating auth_service.
  google_sign_in: ^6.2.1
  firebase_storage: ^11.6.0
  image_picker: ^1.0.7
  provider: ^6.1.2
  intl: ^0.19.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
