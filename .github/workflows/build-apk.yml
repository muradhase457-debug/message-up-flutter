name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android scaffold
        run: flutter create --org com.murad --project-name message_up --platforms=android .

      - name: Install FIXED debug keystore
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1|SHA-1"

      - name: Force compileSdk 36
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compile-sdk.gradle <<'GRADLE'
          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      try { project.android.compileSdkVersion 36 } catch (Exception ignored) {}
                      try { project.android.compileSdk = 36 } catch (Exception ignored) {}
                  }
              }
          }
          GRADLE

      - name: Copy google-services.json
        run: cp google-services.json android/app/google-services.json

      - name: Generate firebase_options.dart
        run: python3 gen_firebase_options.py

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: message-up-apk
          path: build/app/outputs/flutter-apk/app-release.apk
