name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android scaffold
        run: flutter create --org com.murad --project-name message_up --platforms=android .

      - name: Install fixed debug keystore
        run: |
          mkdir -p ~/.android
          echo '' | base64 -d > ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep SHA1

      - name: Force compileSdk 36
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compile-sdk.gradle <<'GRADLE'
          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      try { project.android.compileSdkVersion 36 } catch (Exception ignored) {}
                      try { project.android.compileSdk = 36 } catch (Exception ignored) {}
                  }
              }
          }
          GRADLE

      - name: Copy google-services.json
        run: cp google-services.json android/app/google-services.json

      - name: Generate firebase_options.dart
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('google-services.json'))
          pid = d['project_info']['project_id']
          num = str(d['project_info']['project_number'])
          bucket = d['project_info']['storage_bucket']
          key = app = ''
          for c in d['client']:
              ci = c['client_info']
              if ci['android_client_info']['package_name'] == 'com.murad.message_up':
                  key = c['api_key'][0]['current_key']
                  app = ci['mobilesdk_app_id']
          assert key and app, 'google-services.json is missing api key or app id'
          def opts(extra=''):
              return ("FirebaseOptions(apiKey: '%s', appId: '%s', messagingSenderId: '%s', projectId: '%s', storageBucket: '%s'%s)"
                      % (key, app, num, pid, bucket, extra))
          dart = "import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;\n"
          dart += "import 'package:flutter/foundation.dart' show defaultTargetPlatform, kIsWeb, TargetPlatform;\n\n"
          dart += "class DefaultFirebaseOptions {\n"
          dart += "  static FirebaseOptions get currentPlatform {\n"
          dart += "    if (kIsWeb) return web;\n"
          dart += "    switch (defaultTargetPlatform) {\n"
          dart += "      case TargetPlatform.android: return android;\n"
          dart += "      case TargetPlatform.iOS: return ios;\n"
          dart += "      case TargetPlatform.macOS: return macOS;\n"
          dart += "      case TargetPlatform.windows: return windows;\n"
          dart += "      default: throw UnsupportedError('Unsupported platform');\n"
          dart += "    }\n  }\n\n"
          ios = ", iosBundleId: 'com.murad.messageUp'"
          dom = ", authDomain: '%s.firebaseapp.com'" % pid
          dart += "  static const FirebaseOptions web = " + opts(dom) + ";\n"
          dart += "  static const FirebaseOptions android = " + opts() + ";\n"
          dart += "  static const FirebaseOptions ios = " + opts(ios) + ";\n"
          dart += "  static const FirebaseOptions macOS = " + opts(ios) + ";\n"
          dart += "  static const FirebaseOptions windows = " + opts(dom) + ";\n"
          dart += "}\n"
          open('lib/firebase_options.dart', 'w').write(dart)
          print('firebase_options.dart generated for ' + pid)
          PY

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: message-up-apk
          path: build/app/outputs/flutter-apk/app-release.apk
