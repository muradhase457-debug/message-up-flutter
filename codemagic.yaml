# Message Up — Codemagic cloud build (NO PC NEEDED)
# ---------------------------------------------------------------------------
# What this file does:
#   Push the project to GitHub -> Codemagic reads this file -> builds a
#   release AAB in the cloud -> you download the AAB from Codemagic.
#   No Flutter SDK, no Android Studio, no PC needed on your side.
#
# CRITICAL — READ BEFORE FIRST BUILD:
#   1. REPO LAYOUT: Codemagic expects the Flutter project at the REPO ROOT.
#      Upload the CONTENTS of message-up-flutter/ to the repo root
#      (pubspec.yaml, lib/, codemagic.yaml, ... at top level), NOT the
#      message-up-flutter/ folder itself. If the project sits in a
#      subfolder, this workflow will fail (it runs in the repo root).
#   2. APPLICATION ID: the first `flutter create` step below generates the
#      Android folder with applicationId "com.murad.message_up". That ID is
#      PERMANENT once the app is registered in Firebase / uploaded to Play.
#      If you want a different ID, say so BEFORE the first build — after
#      that it cannot change without making a brand-new app.
#   3. FIRST BUILD = SETUP BUILD: Flutter's generated Android scaffold
#      signs release builds with the DEBUG key by default. The first build
#      proves the project compiles and produces an APK + AAB. It is the
#      TEST build. For Play Store upload later: add a real release
#      keystore (key.properties + .jks, never committed to git) or use
#      Play App Signing, then rebuild.
#   4. GOOGLE SIGN-IN SETUP (one-time, normal steps — part of the flow):
#      a. Download google-services.json from Firebase Console
#         (Project settings -> Android app -> google-services.json) and
#         put it at the REPO ROOT (same place as pubspec.yaml) — the
#         workflow below copies it into android/app/ automatically,
#         because the repo has no android/ folder yet.
#      b. firebase_options.dart is AUTO-GENERATED during the build from
#         google-services.json (step "Generate firebase_options.dart"
#         below). You do NOT need to fill it by hand, and you never need
#         to copy any key anywhere. Keep the template file in the repo —
#         the build overwrites it with real values before compiling.
#         (On a PC, `flutterfire configure` does the same job.)
#      c. FIRST BUILD prints the debug keystore SHA-1 in the build log
#         (step "Print debug keystore SHA-1" below). Copy that SHA-1 into
#         Firebase Console -> Project settings -> Android app ->
#         "SHA certificate fingerprints" -> Add fingerprint -> Save.
#         Then run ONE MORE build. After that, Google Sign-In works on
#         every build with the same debug key.
#      (On a PC, `flutterfire configure` does a + b automatically.)
#   5. CALLS: the Calls tab is still UI-only (WebRTC wiring TODO in
#      lib/screens/calls_screen.dart). Everything else in this build is
#      real + Firestore-wired.
# ---------------------------------------------------------------------------

workflows:
  android-release:
    name: Message Up — Android AAB (release)
    # Android-only build, so a Linux builder is enough and cheapest.
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate missing Android scaffold (safe, keeps lib/ + pubspec)
        # The project ships lib/ + pubspec.yaml only — there is NO android/
        # folder yet. `flutter create` WITHOUT --overwrite only creates the
        # missing files and never touches existing files (lib/, pubspec.yaml,
        # codemagic.yaml, .gitignore, analysis_options.yaml are preserved).
        # --org + --project-name fix the applicationId to com.murad.message_up.
        script: |
          flutter create --org com.murad --project-name message_up --platforms=android .
      - name: Force compileSdk 35 for every Android module (fixes firebase_auth pin)
        # ROOT CAUSE (proven by build log 2026-10-16): firebase_auth 4.x
        # pins compileSdk 33 in its own build.gradle, but its AndroidX
        # helpers (exifinterface 1.4.1, annotation-experimental 1.4.0,
        # lifecycle, core, ...) now require compileSdk 34+. AGP then stops
        # the build at the AAR-metadata check. The app's own compileSdk
        # does NOT fix this — the pin lives inside the plugin.
        # This Gradle init script overrides compileSdk to 35 for EVERY
        # module (app + all plugins) after each project is evaluated,
        # without touching anything in the pub cache. Modules that use
        # the newer DSL (no compileSdkVersion method) safely skip it.
        script: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compile-sdk.gradle <<'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      try {
                          project.android.compileSdkVersion 35
                      } catch (Exception ignored) {
                      }
                  }
              }
          }
          EOF
          echo "compileSdk override installed"
      - name: Copy google-services.json into android/app (if present at repo root)
        # The repo has no android/ folder, so you put google-services.json
        # at the REPO ROOT (next to pubspec.yaml). This step copies it to
        # android/app/ where Google Sign-In reads it. If the file is not
        # in the repo, this step safely does nothing and the build continues.
        script: |
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json && echo "google-services.json copied"; else echo "google-services.json not at repo root yet — add it (header step 4a) and rebuild"; fi
      - name: Generate firebase_options.dart from google-services.json
        # AUTO-GENERATION: reads the repo-root google-services.json and
        # writes lib/firebase_options.dart with the REAL values before
        # compiling — nobody has to copy any key by hand, so no typo can
        # sneak in. If google-services.json is not in the repo yet, this
        # step leaves the template in place and the build continues (the
        # app then shows the Setup Needed screen — see lib/main.dart).
        # If the file IS present but broken/missing a field, the step
        # stops the build with a clear message naming the missing field.
        script: |
          python3 - <<'PY'
          import json, sys, os
          src = 'google-services.json'
          out = 'lib/firebase_options.dart'
          if not os.path.exists(src):
              print('google-services.json not in repo yet — keeping firebase_options.dart template (app will show Setup Needed screen).')
              sys.exit(0)
          with open(src) as f:
              data = json.load(f)
          info = data.get('project_info') or {}
          project_id = info.get('project_id', '')
          project_number = str(info.get('project_number', ''))
          storage_bucket = info.get('storage_bucket', '')
          api_key = ''
          app_id = ''
          for client in data.get('client', []):
              cinfo = client.get('client_info') or {}
              if cinfo.get('android_client_info', {}).get('package_name') == 'com.murad.message_up':
                  keys = client.get('api_key') or []
                  if keys:
                      api_key = keys[0].get('current_key', '')
                  app_id = cinfo.get('mobilesdk_app_id', '')
                  break
          missing = [n for n, v in [('project_id', project_id), ('project_number', project_number), ('storage_bucket', storage_bucket), ('api_key', api_key), ('mobilesdk_app_id', app_id)] if not v]
          if missing:
              print('STOP: google-services.json is missing: ' + ', '.join(missing) + '. Re-download it from Firebase Console (Project settings -> Android app) and upload again.')
              sys.exit(1)
          dart = []
          dart.append('// GENERATED during the Codemagic build from google-services.json.')
          dart.append('// Do not edit by hand — re-download google-services.json to change values.')
          dart.append("import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;")
          dart.append("import 'package:flutter/foundation.dart' show defaultTargetPlatform, kIsWeb, TargetPlatform;")
          dart.append('')
          dart.append('class DefaultFirebaseOptions {')
          dart.append('  static FirebaseOptions get currentPlatform {')
          dart.append('    if (kIsWeb) { return web; }')
          dart.append('    switch (defaultTargetPlatform) {')
          dart.append('      case TargetPlatform.android: return android;')
          dart.append('      case TargetPlatform.iOS: return ios;')
          dart.append('      case TargetPlatform.macOS: return macOS;')
          dart.append('      case TargetPlatform.windows: return windows;')
          dart.append('      case TargetPlatform.linux: throw UnsupportedError("DefaultFirebaseOptions have not been configured for linux.");')
          dart.append('      default: throw UnsupportedError("DefaultFirebaseOptions are not supported for this platform.");')
          dart.append('    }')
          dart.append('  }')
          dart.append('')
          dart.append('  static const FirebaseOptions web = FirebaseOptions(')
          dart.append("    apiKey: '" + api_key + "',")
          dart.append("    appId: '" + app_id + "',")
          dart.append("    messagingSenderId: '" + project_number + "',")
          dart.append("    projectId: '" + project_id + "',")
          dart.append("    authDomain: '" + project_id + ".firebaseapp.com',")
          dart.append("    storageBucket: '" + storage_bucket + "',")
          dart.append('  );')
          dart.append('')
          dart.append('  static const FirebaseOptions android = FirebaseOptions(')
          dart.append("    apiKey: '" + api_key + "',")
          dart.append("    appId: '" + app_id + "',")
          dart.append("    messagingSenderId: '" + project_number + "',")
          dart.append("    projectId: '" + project_id + "',")
          dart.append("    storageBucket: '" + storage_bucket + "',")
          dart.append('  );')
          dart.append('')
          dart.append('  static const FirebaseOptions ios = FirebaseOptions(')
          dart.append("    apiKey: '" + api_key + "',")
          dart.append("    appId: '" + app_id + "',")
          dart.append("    messagingSenderId: '" + project_number + "',")
          dart.append("    projectId: '" + project_id + "',")
          dart.append("    storageBucket: '" + storage_bucket + "',")
          dart.append("    iosBundleId: 'com.murad.messageUp',")
          dart.append('  );')
          dart.append('')
          dart.append('  static const FirebaseOptions macOS = FirebaseOptions(')
          dart.append("    apiKey: '" + api_key + "',")
          dart.append("    appId: '" + app_id + "',")
          dart.append("    messagingSenderId: '" + project_number + "',")
          dart.append("    projectId: '" + project_id + "',")
          dart.append("    storageBucket: '" + storage_bucket + "',")
          dart.append("    iosBundleId: 'com.murad.messageUp',")
          dart.append('  );')
          dart.append('')
          dart.append('  static const FirebaseOptions windows = FirebaseOptions(')
          dart.append("    apiKey: '" + api_key + "',")
          dart.append("    appId: '" + app_id + "',")
          dart.append("    messagingSenderId: '" + project_number + "',")
          dart.append("    projectId: '" + project_id + "',")
          dart.append("    authDomain: '" + project_id + ".firebaseapp.com',")
          dart.append("    storageBucket: '" + storage_bucket + "',")
          dart.append('  );')
          dart.append('}')
          dart.append('')
          with open(out, 'w') as f:
              f.write('\n'.join(dart))
          print('firebase_options.dart generated from google-services.json for project ' + project_id)
          PY
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Analyse (non-blocking on first runs — read the log)
        # `flutter analyze` exits non-zero on warnings too. This build was
        # only tokenizer-checked, never analysed, so lints may exist.
        # Keep it non-blocking so a style lint cannot hide a compile error;
        # the BUILD step below still fails on any real compile error.
        # Once analyze is clean, remove the "|| true" to make it strict.
        script: |
          flutter analyze || true
      - name: Build release AAB
        # First AAB is debug-signed (Flutter template default) = TEST ONLY,
        # not for Play Store upload. See header notes 3–4.
        script: |
          flutter build appbundle --release
      - name: Build release APK (for installing on your own phone to test)
        # AAB cannot be installed directly on a phone — APK can.
        # Download this APK from Codemagic, tap it, install, and test the app.
        script: |
          flutter build apk --release
      - name: Print debug keystore SHA-1 (copy into Firebase Console)
        # One-time setup step (header 4c): the first build is signed with
        # the DEBUG key. Google Sign-In checks this fingerprint. Copy the
        # SHA-1 printed here into Firebase Console -> Project settings ->
        # Android app -> SHA certificate fingerprints -> Add fingerprint,
        # then run one more build. Never fails the build (|| true).
        script: |
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android 2>/dev/null | grep -E "SHA1|SHA-256" || echo "SHA-1 not printed — keystore not found yet; it appears after the first successful build"
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/logs/**
    publishing:
      # No auto-publish: you download the AAB from Codemagic and decide
      # yourself when it goes to Play Console (closed test first).
      email:
        recipients:
          - muradhase457@gmail.com
        notify:
          success: true
          failure: true
